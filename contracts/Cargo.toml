[workspace]
resolver = "2"
members = [
    "common",
    "escrow-gate",
    "zk-verifier-registry",
    "example-marketplace-escrow",
]

[workspace.dependencies]
soroban-sdk = "27.0.6"
verity-common = { path = "common" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
