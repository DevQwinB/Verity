[package]
name = "example-marketplace-escrow"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
verity-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
escrow-gate = { path = "../escrow-gate", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
