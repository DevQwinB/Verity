[package]
name = "escrow-gate"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
verity-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
zk-verifier-registry = { path = "../zk-verifier-registry", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
