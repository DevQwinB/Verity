name: Publish Container Images

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push Images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/verity-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/verity-backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push reexecutor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: reexecutor-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/verity-reexecutor:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/verity-reexecutor:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/verity-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/verity-frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
